<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>Pré-adoption — {{asso.nom}}</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="entete-site.css">
<link rel="stylesheet" href="nouveaux-formulaires.css">
<script src="association-config.js"></script>
<script src="branding.js"></script>
<script src="garde-offre.js"></script>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<script src="supabase-config.js"></script>
<script src="formulaire-generique.js"></script>
<script>
FG.page({
  public: true, titre: "Demande de pré-adoption", intro: "Merci de votre intérêt pour l'adoption. Ce questionnaire nous permet de mieux vous connaître et de trouver le compagnon qui vous correspond. Il n'engage ni vous ni l'association.",
  sections: [
    (function () { var s = FG.PERSONNE('Vos coordonnées'); s.champs.forEach(function (c) { if (c.id === 'email') c.requis = true; }); return s; })(),
    { titre: 'Votre demande', champs: [
      { id:'animal_souhaite', label:'Animal souhaité (nom ou description)', type:'text', large:true }
    ]},
    { titre: 'Votre foyer et votre logement', champs: [
      { id:'composition_foyer', label:'Composition du foyer', type:'text', large:true },
      { id:'nombre_enfants', label:"Nombre d'enfants", type:'number' },
      { id:'autres_animaux', label:'Animaux déjà présents', type:'text' },
      { id:'type_logement', label:'Type de logement', type:'select', options:['Appartement','Maison'] },
      { id:'surface_m2', label:'Surface (m²)', type:'number' },
      { id:'statut_logement', label:'Vous êtes', type:'select', options:['Propriétaire','Locataire'] },
      { id:'accord_proprietaire', label:'Si locataire : accord du propriétaire', type:'select', options:[['true','Oui'],['false','Non']] },
      { id:'exterieur', label:'Extérieur', type:'select', options:['Aucun','Balcon','Jardin non clos','Jardin clos'] }
    ]},
    { titre: 'Votre expérience', champs: [
      { id:'experience', label:"Expérience avec les animaux", type:'textarea' },
      { id:'budget_veto', label:'Budget vétérinaire prévu (par an)', type:'text' },
      { id:'gestion_absences', label:'Que ferez-vous pendant vos absences (vacances, week-ends) ?', type:'textarea' },
      { id:'motivation', label:'Vos motivations', type:'textarea' },
      { id:'frais_acceptes', label:"J'accepte la participation aux frais d'adoption", type:'checkbox', requis:true, large:true }
    ]}
  ],
  libelleBouton: 'Envoyer ma demande', rpc: 'envoyer_preadoption',
  messageSucces: "Merci ! Votre demande a bien été transmise, nous reviendrons vers vous rapidement."
});
</script>
</body>
</html>
