<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>Parrainage — {{asso.nom}}</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="entete-site.css">
<link rel="stylesheet" href="nouveaux-formulaires.css">
<script src="association-config.js"></script>
<script src="branding.js"></script>
<script src="garde-offre.js"></script>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<script src="supabase-config.js"></script>
<script src="selecteur-personne.js"></script>
<script src="formulaire-generique.js"></script>
<script>
FG.page({
  titre: 'Parrainage', intro: "Enregistrer les parrains d'animaux (dons réguliers ou ponctuels dédiés à un animal).",
  sections: [
    FG.PERSONNE('Parrain / marraine'),
    { titre: 'Parrainage', champs: [
      { id:'animal_id', label:'Animal parrainé (facultatif)', type:'animal' },
      { id:'montant', label:'Montant (€)', type:'number', requis:true },
      { id:'periodicite', label:'Périodicité', type:'select', requis:true, defaut:'mensuel', options:[['mensuel','Mensuel'],['trimestriel','Trimestriel'],['annuel','Annuel'],['ponctuel','Ponctuel']] },
      { id:'mode_paiement', label:'Mode de paiement', type:'select', options:['Virement','Prélèvement','Chèque','Espèces','Carte bancaire'] },
      { id:'date_debut', label:'Date de début', type:'date', requis:true },
      { id:'commentaires', label:'Commentaires', type:'textarea' },
      { id:'saisi_par', label:'Saisi par', type:'saisisseur' }
    ]}
  ],
  rpc: 'creer_parrainage', messageSucces: 'Parrainage enregistré.',
  listes: [{ titre: 'Parrainages', vide: 'Aucun parrainage.',
    charger: async function (sb) { var r = await sb.rpc('lister_parrainages'); if (r.error) throw r.error; return r.data; },
    colonnes: [ { t:'Parrain', f:function(r){return r.parrain;} }, { t:'Animal', f:function(r){return r.animal;} }, { t:'Montant', f:function(r){return FG.fmtEuro(r.montant) + ' / ' + r.periodicite;} },
      { t:'Début', f:function(r){return FG.fmtDate(r.date_debut);} }, { t:'Fin', f:function(r){return r.date_fin ? FG.fmtDate(r.date_fin) : 'En cours';} } ],
    actions: [{ libelle:'Mettre fin', si:function(r){return !r.date_fin;}, f: async function (r, sb) { var x = await sb.rpc('terminer_parrainage', { p_id: r.id }); if (x.error) throw x.error; } }] }]
});
</script>
</body>
</html>
